{% extends "base.html" %}
{% set page_title = _("Page not found") %}
{% block content %}
<section class="section">
  <div class="container empty error-page">
    <p class="error-code">404</p>
    <h1>{{ _("Page not found") }}</h1>
    <p class="muted">{{ _("The page you are looking for doesn't exist or has been moved.") }}</p>
    <a class="btn btn-primary" href="{{ url_for('public.index') }}">{{ _("Back to home") }}</a>
  </div>
</section>
{% endblock %}
