{% extends "base.html" %}
{% set page_title = _("Something went wrong") %}
{% block content %}
<section class="section">
  <div class="container empty error-page">
    <p class="error-code">500</p>
    <h1>{{ _("Something went wrong") }}</h1>
    <p class="muted">{{ _("An unexpected error occurred. Please try again later.") }}</p>
    <a class="btn btn-primary" href="{{ url_for('public.index') }}">{{ _("Back to home") }}</a>
  </div>
</section>
{% endblock %}
